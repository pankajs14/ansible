---
- name: Check and install Chrome (64-bit only) with version from Add/Remove Programs
  hosts: "{{ target_server }}"
  gather_facts: no

  tasks:

    - name: Check if Chrome is listed in Add/Remove Programs (64-bit only)
      win_shell: |
        $apps = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
          Where-Object { $_.DisplayName -like "*Chrome*" }
        if ($apps) {
          $apps | ForEach-Object { "$($_.DisplayName) - Version: $($_.DisplayVersion)" }
        }
      register: chrome_check
      ignore_errors: yes

    - name: Determine if Chrome is already installed
      set_fact:
        chrome_installed: "{{ chrome_check.stdout | length > 0 }}"

    - name: Show Chrome version if already installed
      debug:
        msg: |
          Chrome is already installed:
          {{ chrome_check.stdout_lines }}
      when: chrome_installed

    - name: Install Chrome from E:\chrome if not installed
      win_command: "E:\\chrome\\ChromeSetup.exe /silent /install"
      when: not chrome_installed
      register: chrome_install

    - name: Wait 10 seconds for installation to complete
      win_shell: Start-Sleep -Seconds 10
      when: not chrome_installed

    - name: Get Chrome version after installation
      win_shell: |
        $apps = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
          Where-Object { $_.DisplayName -like "*Chrome*" }
        $apps | ForEach-Object { "$($_.DisplayName) - Version: $($_.DisplayVersion)" }
      register: post_install_version

    - name: Show Chrome version after install
      debug:
        msg: "{{ post_install_version.stdout_lines }}"
