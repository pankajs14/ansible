---
- name: Install Chrome if not already installed and show version
  hosts: "{{ target_server }}"
  gather_facts: no

  tasks:

    - name: Check if Chrome is already installed by checking for EXE
      win_stat:
        path: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
      register: chrome_path

    - name: Show message if Chrome is already installed
      debug:
        msg: "Chrome is already installed."
      when: chrome_path.stat.exists

    - name: Install Chrome from E:\chrome if not installed
      win_command: "E:\\chrome\\ChromeSetup.exe /silent /install"
      when: not chrome_path.stat.exists
      register: chrome_install

    - name: Wait 10 seconds for installation to complete
      win_shell: Start-Sleep -Seconds 10
      when: not chrome_path.stat.exists

    - name: Get Chrome version from chrome.exe
      win_shell: |
        $path = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
        if (Test-Path $path) {
          (Get-Item $path).VersionInfo.ProductVersion
        } else {
          "Chrome not found"
        }
      register: post_install_version

    - name: Show Chrome version after install
      debug:
        msg: "Chrome version: {{ post_install_version.stdout }}"
